# Справочник неисправностей и ремонта (разделы 8–9).
#
# ВНИМАНИЕ: денежные значения — ориентировочные диапазоны по умолчанию (₽),
# а не цены конкретных сервисов. Перед покупкой получайте смету; после сделок
# модуль learning.py калибрует оценки по фактическим результатам.
# Значения можно и нужно править под свой город.
#
# parts: [min, max]           — стоимость деталей в рублях
# parts_frac: [lo, hi]        — доля рыночной цены исправного товара (+ parts_min)
# success                     — оценка вероятности успешного ремонта (гипотеза, не статистика)
# skill: basic / soldering / expert — требуемая квалификация для DIY

version: 1

negation_words: ["не", "нет", "без", "ни"]

symptoms:
  no_power:
    label: "Не включается"
    patterns: ["не включается", "не включаеться", "не запускается", "не подает признаков жизни", "признаков жизни не подает", "не реагирует на кнопку"]
  no_charge:
    label: "Не заряжается"
    patterns: ["не заряжается", "не заряжаеться", "не видит зарядку", "не видит зарядное", "зарядка не идет", "гнездо зарядки", "разъем зарядки сломан", "плохо заряжается"]
  battery:
    label: "Изношен аккумулятор"
    patterns: ["не держит заряд", "быстро разряжается", "быстро садится", "вздулся аккумулятор", "вздулась батарея", "вздулся акб", "аккумулятор под замену", "батарея под замену", "акб под замену", "плохо держит заряд"]
  screen:
    label: "Повреждён экран"
    patterns: ["разбит экран", "разбит дисплей", "разбитый экран", "разбитый дисплей", "экран разбит", "дисплей разбит", "трещина на экране", "трещина экрана", "треснут экран", "треснул экран", "треснул дисплей", "не работает сенсор", "не работает тачскрин", "полосы на экране", "полоса на экране", "битые пиксели", "пятна на экране", "не работает экран", "не работает дисплей", "черное пятно"]
  no_image:
    label: "Нет изображения"
    patterns: ["нет изображения", "нет картинки", "нет сигнала", "нет вывода изображения", "черный экран", "не выводит изображение", "нет подсветки", "звук есть изображения нет"]
  no_boot:
    label: "Не загружается"
    patterns: ["не загружается", "не грузится", "синий экран", "bsod", "ошибка при запуске", "циклическая перезагрузка", "bootloop", "бутлуп", "висит на логотипе", "зависает на логотипе", "не проходит загрузку"]
  software:
    label: "Программный сбой"
    patterns: ["нужна прошивка", "требует прошивки", "слетела прошивка", "нужно перепрошить", "сбой по", "программный сбой", "переустановить windows", "нужна переустановка", "слетела система", "слетела ос"]
  storage:
    label: "Проблема накопителя"
    patterns: ["не видит диск", "не видит ssd", "не видит hdd", "не видит жесткий", "битые сектора", "диск щелкает", "без диска", "без ssd", "без hdd", "без жесткого диска", "нет накопителя"]
  overheat:
    label: "Перегрев / шум охлаждения"
    patterns: ["перегревается", "сильно греется", "греется", "выключается от перегрева", "троттлит", "шумит вентилятор", "громко шумит", "гудит кулер", "шумит кулер", "сильно шумит"]
  reboot:
    label: "Перезагрузки / зависания / артефакты"
    patterns: ["перезагружается", "сам перезагружается", "зависает", "виснет", "вылетает", "артефакты", "выключается сам", "самопроизвольно выключается"]
  port:
    label: "Неисправен разъём"
    patterns: ["не работает разъем", "сломан разъем", "не работает hdmi", "hdmi не работает", "сломан hdmi", "не работает usb", "не работает порт", "разъем hdmi", "сломано гнездо", "не работает гнездо"]
  liquid:
    label: "Контакт с жидкостью"
    patterns: ["попала вода", "попала жидкость", "залит", "залили", "залитый", "утопил", "утопила", "уронил в воду", "после воды", "после жидкости", "после залития", "окислы", "коррозия", "после попадания жидкости"]
  drop:
    label: "Механическое повреждение"
    patterns: ["после падения", "уронил", "уронили", "упал", "разбит корпус", "трещина корпуса", "трещина на корпусе", "погнут", "сломан корпус", "отломан"]
  buttons:
    label: "Кнопки / клавиатура"
    patterns: ["не работает кнопка", "залипает кнопка", "сломана кнопка", "не работают кнопки", "не работает клавиатура", "не работают клавиши", "западает клавиша", "не работает кнопка питания"]
  drift:
    label: "Дрейф стиков"
    patterns: ["дрифт", "дрейф", "стик дрифтит", "стик уводит", "стики уводит"]
  optical_drive:
    label: "Не работает привод"
    patterns: ["не читает диски", "привод не работает", "не работает привод", "не видит диски"]
  motor:
    label: "Двигатель / механизм"
    patterns: ["не крутится", "не вращается", "не работает мотор", "двигатель не работает", "гудит но не крутится", "не отжимает", "не сливает", "не крутит барабан", "не тянет", "не всасывает", "плохо всасывает"]
  sensor:
    label: "Датчики / навигация"
    patterns: ["ошибка датчика", "не видит базу", "не возвращается на базу", "ошибка лидара", "лидар не крутится", "не строит карту", "ошибка бампера", "датчик падения"]
  no_cooling:
    label: "Не охлаждает"
    patterns: ["не морозит", "не холодит", "плохо морозит", "плохо холодит", "не охлаждает", "утечка фреона", "не работает компрессор", "компрессор не запускается"]
  leak:
    label: "Протечка"
    patterns: ["течет", "протекает", "подтекает", "протечка", "течь"]
  error_code:
    label: "Ошибка / код неисправности"
    patterns: ["выдает ошибку", "код ошибки", "показывает ошибку", "ошибка e", "ошибка f", "мигает индикатор", "мигают индикаторы"]
  lens_issue:
    label: "Оптика / автофокус"
    patterns: ["грибок", "плесень", "не работает автофокус", "не фокусируется", "ошибка объектива", "пыль внутри объектива", "царапина на линзе"]
  no_heating:
    label: "Не греет / не нагревает"
    patterns: ["не греет", "не нагревает", "плохо греет", "не нагревается", "вода холодная"]
  shutter:
    label: "Затвор"
    patterns: ["ошибка затвора", "затвор не работает", "сломан затвор", "заклинил затвор"]
  biometrics:
    label: "Face ID / Touch ID"
    patterns: ["не работает face id", "не работает faceid", "face id не работает", "faceid не работает", "не работает touch id", "touch id не работает", "нет face id", "без face id"]
  sound:
    label: "Звук / микрофон"
    patterns: ["не работает динамик", "нет звука", "хрипит", "не работает микрофон", "не работает один наушник", "не работает правый наушник", "не работает левый наушник", "тихий звук"]
  mechanism:
    label: "Механизм / фурнитура"
    patterns: ["сломан газлифт", "газлифт сломан", "газлифт не держит", "не держит высоту", "опускается само", "сломана крестовина", "сломан подлокотник", "сломан механизм", "отвалилось колесо", "сломано колесо"]
  missing_accessory:
    label: "Нет блока питания / зарядки"
    accessory: true
    patterns: ["без блока питания", "без зарядки", "без зарядного", "без бп", "нет зарядки", "нет блока питания", "без зарядного устройства"]
    negation_exempt: true
  untested:
    label: "Не проверялся"
    condition: true
    patterns: ["не проверял", "не проверялся", "не проверено", "проверить не на чем", "состояние неизвестно", "работоспособность не проверял", "не знаю работает ли"]
    negation_exempt: true
  parts_listing:
    label: "Продаётся на запчасти / под восстановление"
    condition: true
    patterns: ["на запчасти", "на детали", "донор", "на разбор", "под восстановление", "под ремонт", "в ремонт"]
    negation_exempt: true
  unknown_fault:
    label: "Неисправность не уточнена"
    patterns: ["неисправен", "неисправна", "неисправно", "неисправный", "не работает", "сломан", "сломана", "требует ремонта", "нужен ремонт", "требует диагностики", "нужна диагностика", "глючит"]

# Симптомы-причины поглощают симптомы-следствия: «попала вода, не включается» —
# одна поломка, затраты не суммируются.
cause_symptoms: [liquid, drop]
effect_symptoms: [no_power, no_image, no_boot, reboot, no_charge, screen, unknown_fault]

# Дополнительное распознавание: «АКБ 76%» → износ аккумулятора (порог, %).
battery_health_threshold: 80

red_flags:
  activation_lock:
    label: "Блокировка активации / привязка к чужому аккаунту"
    critical: true
    risk: 60
    patterns: ["icloud", "айклауд", "блокировка активации", "заблокирован", "залочен", "frp", "google аккаунт", "гугл аккаунт", "аккаунт google", "привязан к аккаунту", "привязан к учетной записи", "не помню пароль", "забыл пароль", "режим пропажи", "mdm", "запаролен", "под паролем", "пароль не знаю"]
    exclude_before: ["без", "не", "нет", "отвяз", "выйд", "вышел", "чист"]
    exclude_after: ["чист", "свобод", "отвяз", "выйд", "выход", "сброш", "нет", "отсутству", "не привяз"]
  imei_blacklist:
    label: "IMEI в блокировке"
    critical: true
    risk: 60
    patterns: ["imei в блокировке", "imei заблокирован", "в черном списке", "заблокирован оператором", "imei блок"]
  questionable_origin:
    label: "Сомнительное происхождение — требуется проверка"
    critical: true
    risk: 50
    patterns: ["нашел на улице", "нашел в такси", "найденный", "находка", "нашли на улице"]
  prepayment:
    label: "Требование предоплаты / перевода на карту"
    critical: true
    risk: 60
    patterns: ["только предоплата", "только по предоплате", "100% предоплата", "по 100% предоплате", "переведите на карту", "перевод на карту", "оплата переводом на карту", "предоплата обязательна"]
  replica:
    label: "Копия / реплика — оценка оригинала неприменима"
    critical: true
    risk: 50
    patterns: ["копия", "реплика", "не оригинал", "неоригинал", "китайская копия", "1:1", "люкс копия", "lux копия", "подделка"]
    exclude_before: ["экран", "дисплей", "аккумулятор", "акб", "батаре", "зарядк", "шлейф", "модул", "кабель", "блок питания"]
    exclude_after: ["экран", "дисплей", "аккумулятор", "акб", "батаре", "зарядк", "шлейф", "модул", "кабель", "блок питания", "чехол"]
  off_platform:
    label: "Просьба перейти в сторонний мессенджер"
    critical: false
    risk: 15
    patterns: ["пишите в whatsapp", "пишите в ватсап", "пишите в вотсап", "пишите в телеграм", "пишите в telegram", "только whatsapp", "только в мессенджер", "звоните в whatsapp"]
  replaced_parts:
    label: "Неоригинальные / заменённые компоненты"
    critical: false
    risk: 10
    resale_factor: 0.9
    patterns: ["неоригинальный экран", "неоригинальный дисплей", "не оригинальный экран", "не оригинальный дисплей", "копия дисплея", "копия экрана", "дисплей копия", "экран копия", "менялся экран", "менялся дисплей", "замена экрана", "заменен экран", "заменен дисплей", "неоригинальный аккумулятор", "неоригинальная батарея", "aftermarket", "incell"]
    negation_exempt: true
  no_docs:
    label: "Нет документов / чека"
    critical: false
    risk: 5
    patterns: ["без документов", "без чека", "документов нет", "чека нет"]
    negation_exempt: true
  cosmetic:
    label: "Косметические дефекты"
    critical: false
    risk: 3
    resale_factor: 0.95
    patterns: ["царапин", "потертост", "сколы", "скол на", "вмятин", "потерт", "порвана обивка"]
    exclude_after: ["нет", "отсутству"]
  no_elevator:
    label: "Крупногабарит без лифта — дорогая погрузка"
    critical: false
    risk: 3
    extra_transport: 1000
    patterns: ["без лифта", "лифта нет", "нет лифта", "лифт не работает"]
    negation_exempt: true

signals:
  motivated_seller:
    label: "Продавец мотивирован (срочно/переезд)"
    patterns: ["срочно", "переезд", "уезжаю", "торг уместен", "быстро отдам", "нужны деньги", "отдам за"]
  no_bargain:
    label: "Продавец заявил «без торга»"
    patterns: ["без торга", "торг неуместен", "торга нет", "цена окончательная", "торг не уместен"]

# Общие проверки до покупки по группам (дополняют проверки по симптомам).
group_checks:
  phone: ["Проверить IMEI (совпадение в настройках и на коробке/лотке)", "Проверить камеры, динамики, микрофон, Wi-Fi, зарядку"]
  laptop: ["Проверить экран на битые пиксели, клавиатуру, тачпад, порты", "Посмотреть износ батареи и температуры под нагрузкой"]
  desktop: ["Запустить стресс-тест 10–15 минут", "Сверить комплектующие с объявлением"]
  gpu: ["Проверить в рабочем ПК: изображение, стресс-тест 15 минут, температуры", "Осмотреть следы вскрытия/пайки"]
  monitor: ["Проверить на битые пиксели и засветы на однотонном фоне"]
  console: ["Проверить чтение дисков, работу геймпадов и входы HDMI/USB", "Убедиться, что консоль не заблокирована (бан/аккаунт)"]
  small_appliance: ["Запустить полный рабочий цикл на месте"]
  large_appliance: ["Проверить работу на месте; оценить погрузку и транспортировку заранее"]
  microwave: ["Проверить нагрев стакана воды за 1 минуту"]
  tv: ["Проверить на битые пиксели, засветы и все входы"]
  photo: ["Узнать пробег затвора, проверить матрицу на битые пиксели"]
  audio: ["Проверить звук на разных уровнях громкости, все каналы"]
  tool: ["Проверить под нагрузкой, люфт патрона, состояние аккумуляторов"]
  furniture: ["Осмотреть каркас, механизмы, обивку"]
  other: []

# Группы, где самостоятельный ремонт запрещён справочником.
no_diy_groups:
  microwave: "Высокое напряжение (магнетрон, высоковольтный конденсатор) — только сервис"

# Профили ремонта. default — базовые значения; группы переопределяют нужные поля.
profiles:
  default:
    no_power:
      class: C
      causes: ["Неисправность цепи питания"]
      alt_causes: ["Неисправен аккумулятор/блок питания", "Повреждение платы"]
      diy: {allowed: true, skill: basic, parts_frac: [0.0, 0.10], hours: 2, success: 0.25}
      service: {diag: [500, 1500], parts_frac: [0.05, 0.25], labor: [1500, 5000], success: 0.5, days: 7}
      checks: ["Попросить видео попытки включения", "Проверить с заведомо исправным зарядным устройством/кабелем", "Осмотреть плату и индикаторы влаги на следы жидкости и вскрытия"]
    unknown_fault:
      class: C
      causes: ["Неисправность не описана — причина неизвестна"]
      alt_causes: []
      diy: {allowed: false, note: "Без описания симптомов DIY не планируется"}
      service: {diag: [500, 1500], parts_frac: [0.05, 0.30], labor: [1500, 5000], success: 0.45, days: 7}
      checks: ["Запросить точные симптомы и историю поломки", "Узнать, проводилась ли диагностика и её результат", "Проверить на месте до оплаты"]
    liquid:
      class: C
      causes: ["Коррозия/окислы на плате после контакта с жидкостью"]
      alt_causes: ["Повреждение нескольких модулей", "Отложенные отказы после ремонта"]
      diy: {allowed: false, note: "Ультразвуковая чистка и компонентный ремонт — сервис"}
      service: {diag: [500, 1500], parts_frac: [0.05, 0.35], labor: [2000, 6000], success: 0.35, days: 10}
      checks: ["Осмотреть индикаторы влаги и плату", "Учитывать риск отложенных отказов даже после ремонта"]
    drop:
      class: B
      causes: ["Механическое повреждение корпуса/модулей"]
      alt_causes: ["Скрытое повреждение платы"]
      diy: {allowed: true, skill: basic, parts_frac: [0.05, 0.20], parts_min: 500, tools: 300, hours: 2, success: 0.6}
      service: {diag: [0, 1000], parts_frac: [0.05, 0.25], labor: [1000, 3000], success: 0.75, days: 5}
      checks: ["Проверить все функции, а не только заявленную поломку"]
    screen:
      class: B
      causes: ["Повреждён дисплейный модуль"]
      alt_causes: ["Повреждён шлейф", "Неисправен контроллер дисплея на плате"]
      diy: {allowed: true, skill: basic, parts_frac: [0.15, 0.35], parts_min: 1500, tools: 500, hours: 2, success: 0.7}
      service: {diag: [0, 500], parts_frac: [0.15, 0.35], parts_min: 1500, labor: [1000, 3000], success: 0.9, days: 3}
      checks: ["Проверить изображение и сенсор по всей площади", "Убедиться, что повреждён только дисплей, а не корпус/плата"]
    battery:
      class: A
      causes: ["Износ аккумулятора"]
      alt_causes: ["Неисправен контроллер заряда"]
      diy: {allowed: true, skill: basic, parts: [800, 3000], tools: 300, hours: 1, success: 0.85}
      service: {diag: [0, 0], parts: [800, 3000], labor: [500, 1500], success: 0.95, days: 2}
      as_is_factor: 0.85
      checks: ["Посмотреть состояние/ёмкость аккумулятора в настройках или утилитой", "Проверить, не вздут ли аккумулятор (опасно)"]
    no_charge:
      class: B
      causes: ["Загрязнён или повреждён разъём зарядки"]
      alt_causes: ["Неисправен кабель/зарядное устройство", "Неисправна цепь заряда на плате"]
      diy: {allowed: true, skill: basic, parts: [0, 1000], tools: 300, hours: 1, success: 0.5}
      service: {diag: [0, 700], parts: [300, 1500], labor: [800, 2500], success: 0.8, days: 3}
      checks: ["Проверить заряд своим исправным кабелем и блоком питания", "Осмотреть разъём на окислы и загрязнение"]
    no_boot:
